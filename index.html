<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B0B0D" />
<title>أمان كيدز — إضافة اشتراك</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/tweetnacl/1.0.3/nacl-fast.min.js"></script>
<style>
  :root { --bg:#0B0B0D; --card:#1C1C1E; --line:rgba(255,255,255,.08); --dim:rgba(255,255,255,.55); --ok:#30D158; --warn:#FF9F0A; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:#fff; font-family:Tajawal, -apple-system, system-ui, sans-serif; }
  main { max-width:480px; margin:0 auto; padding:28px 18px 40px; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .icon { width:52px; height:52px; border-radius:13px; background:linear-gradient(180deg,#3A3A3E,#1C1C1F); display:flex; align-items:center; justify-content:center; box-shadow:inset 0 1px 0 rgba(255,255,255,.18); }
  h1 { font-size:26px; font-weight:800; margin:0 0 6px; }
  p.sub { margin:0 0 22px; color:var(--dim); font-size:15px; line-height:1.6; }
  .seg { display:flex; background:var(--card); border-radius:12px; padding:3px; margin-bottom:18px; }
  .seg button { flex:1; border:0; background:transparent; color:var(--dim); font:700 15px Tajawal; padding:10px; border-radius:9px; }
  .seg button.on { background:#3A3A3C; color:#fff; }
  label { display:block; margin-bottom:14px; }
  label span { display:block; font-size:14px; font-weight:700; color:var(--dim); margin-bottom:7px; }
  input { width:100%; height:52px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:#fff; padding:0 14px; font:500 17px -apple-system, system-ui, sans-serif; direction:ltr; text-align:left; outline:none; }
  input:focus { border-color:#fff; }
  .row { display:flex; gap:10px; } .row label { flex:1; }
  button.send { width:100%; height:54px; border:0; border-radius:14px; background:#fff; color:#0B0B0D; font:800 18px Tajawal; margin-top:8px; }
  button.send:disabled { opacity:.5; }
  .msg { margin-top:16px; padding:14px 16px; border-radius:12px; background:var(--card); font-weight:700; font-size:15px; line-height:1.6; display:none; }
  .msg.ok { display:block; color:var(--ok); } .msg.warn { display:block; color:var(--warn); } .msg.info { display:block; color:var(--dim); }
  .note { margin-top:22px; color:rgba(255,255,255,.35); font-size:13px; line-height:1.7; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <div class="icon"><svg viewBox="0 0 24 24" width="28" height="28" fill="none"><path d="M12 21.5s7.5-3.6 7.5-9.4V5.3L12 2.5 4.5 5.3v6.8c0 5.8 7.5 9.4 7.5 9.4z" fill="#fff"/><path d="m8.8 12 2.2 2.2 4.3-4.4" stroke="#1C1C1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div><div style="font-weight:800;font-size:18px">أمان كيدز</div><div style="color:var(--dim);font-size:13px">إضافة اشتراك للتلفزيون</div></div>
  </div>

  <div id="bad" class="msg" style="color:var(--warn)">الرابط ناقص. امسح رمز QR من شاشة التلفزيون مرة ثانية.</div>

  <form id="f" class="hidden" autocomplete="off">
    <h1>بيانات الاشتراك</h1>
    <p class="sub">تُشفَّر في جوالك وتنرسل للتلفزيون مباشرة — ما أحد غيره يقدر يقرأها.</p>

    <div class="seg">
      <button type="button" id="mX" class="on">Xtream</button>
      <button type="button" id="mM">رابط M3U</button>
    </div>

    <label><span>اسم الاشتراك (اختياري)</span><input id="name" placeholder="اشتراك البيت" style="direction:rtl;text-align:right" /></label>
    <div id="xt">
      <label><span>رابط السيرفر</span><input id="url" inputmode="url" placeholder="http://example.com:8080" /></label>
      <div class="row">
        <label><span>اسم المستخدم</span><input id="user" autocapitalize="off" /></label>
        <label><span>كلمة المرور</span><input id="pass" autocapitalize="off" /></label>
      </div>
    </div>
    <div id="m3" class="hidden">
      <label><span>رابط M3U كامل</span><input id="m3u" inputmode="url" placeholder="http://host:port/get.php?username=…&password=…" /></label>
    </div>

    <button class="send" id="send" type="submit">إرسال للتلفزيون</button>
    <div id="msg" class="msg"></div>
    <p class="note">ملاحظة: تقدر ترسل أكثر من اشتراك، كل واحد على حدة، ما دام رمز QR ظاهر على التلفزيون.</p>
  </form>
</main>

<script>
(function () {
  var RELAY = 'https://ntfy.sh';
  function b64url(bytes) { var s=''; for (var i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function fromB64url(str) { var s=str.replace(/-/g,'+').replace(/_/g,'/'); var bin=atob(s+'==='.slice((s.length+3)%4)); var out=new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }

  var params = {};
  location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) params[p[0]] = decodeURIComponent(p[1] || ''); });
  if (params.r && /^https:\/\//.test(params.r)) RELAY = params.r.replace(/\/+$/, '');
  else if (params.r && /^http:\/\/(127\.0\.0\.1|localhost)/.test(params.r)) RELAY = params.r;
  var topic = params.t, tvKey = null;
  try { tvKey = params.k ? fromB64url(params.k) : null; } catch (e) {}
  if (!topic || !/^aman-[A-Za-z0-9_-]{10,}$/.test(topic) || !tvKey || tvKey.length !== 32) {
    document.getElementById('bad').style.display = 'block';
    return;
  }
  // نزيل المفتاح من شريط العنوان (لا يبقى في السجل)
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  document.getElementById('f').classList.remove('hidden');

  var mode = 'x';
  var $ = function (id) { return document.getElementById(id); };
  $('mX').onclick = function () { mode='x'; $('mX').className='on'; $('mM').className=''; $('xt').className=''; $('m3').className='hidden'; };
  $('mM').onclick = function () { mode='m'; $('mM').className='on'; $('mX').className=''; $('m3').className=''; $('xt').className='hidden'; };

  function show(cls, text) { var m=$('msg'); m.className='msg '+cls; m.textContent=text; }

  function waitAck(sinceTs) {
    var tries = 0;
    (function poll() {
      tries++;
      fetch(RELAY + '/' + topic + '-ok/json?poll=1&since=' + sinceTs).then(function (r) { return r.text(); }).then(function (t) {
        if (t && t.indexOf('"message"') !== -1) { show('ok', '✓ تم الحفظ في التلفزيون. تقدر تضيف اشتراك ثاني أو تقفل الصفحة.'); $('send').disabled=false; return; }
        if (tries < 15) setTimeout(poll, 2000);
        else { show('warn', 'انرسلت البيانات، بس التلفزيون ما أكّد الاستلام. تأكد إن رمز QR لسا ظاهر على الشاشة.'); $('send').disabled=false; }
      }).catch(function () { if (tries < 15) setTimeout(poll, 2000); });
    })();
  }

  $('f').onsubmit = function (e) {
    e.preventDefault();
    var data = { name: $('name').value.trim() };
    if (mode === 'm') {
      data.url = $('m3u').value.trim();
      if (!/username=/.test(data.url) || !/password=/.test(data.url)) { show('warn', 'رابط M3U لازم يحتوي username و password'); return; }
    } else {
      data.url = $('url').value.trim(); data.username = $('user').value.trim(); data.password = $('pass').value.trim();
      if (!data.url || !data.username || !data.password) { show('warn', 'أكمل الرابط واسم المستخدم وكلمة المرور'); return; }
    }
    var eph = nacl.box.keyPair();
    var nonce = nacl.randomBytes(24);
    var plain = new TextEncoder().encode(JSON.stringify(data));
    var box = nacl.box(plain, nonce, tvKey, eph.secretKey);
    var env = JSON.stringify({ e: b64url(eph.publicKey), n: b64url(nonce), c: b64url(box) });
    $('send').disabled = true;
    show('info', 'جاري الإرسال…');
    var since = Math.floor(Date.now() / 1000) - 2;
    fetch(RELAY + '/' + topic, { method: 'POST', body: env }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      show('info', 'انرسلت — بانتظار تأكيد التلفزيون…');
      waitAck(since);
    }).catch(function () { show('warn', 'تعذر الإرسال. تأكد من الإنترنت وحاول مرة ثانية.'); $('send').disabled = false; });
  };
})();
</script>
</body>
</html>
